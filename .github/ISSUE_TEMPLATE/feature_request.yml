name: Feature request
description: Suggest an improvement for google_speech_gdx_plus
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the package. Please do not include credentials, private audio, or other sensitive data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or alternative approaches you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant links, examples, or non-sensitive screenshots.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: I removed credentials, tokens, private audio, and personal data.
          required: true
